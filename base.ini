[settings]
; Remote origin for the data archives and non-bundled media: data.zip,
; maps.zip, languages.zip, movies/ and fonts/. These are served from the CDN.
; The img_pack/ and aud_pack/ media packs are now bundled locally in this
; workspace (see game.js archiveFolderUrl), so they no longer come from here.
; Leave empty to serve every asset from the local folder instead.
baseUrl=https://rawcdn.githack.com/CaveGameDev/O-web/main/
; https://raw.githubusercontent.com/CaveGameDev/O-Launcher/assets
; Set to true to append the pack folders (img_pack/, aud_pack/) to baseUrl;
; false fetches archives straight from the baseUrl root / locally. The media
; packs are served locally regardless (bundled in the workspace).
useRemoteParts=false
; NEW BELOW
accountId=

; How many part downloads may run at once (1-16). 6-8 is a good default;
; raise it on fast links, lower it on weak servers.
concurrency=6

; Persist combined archives in IndexedDB so repeat boots skip the ~1.5 GB
; download. Set false to always re-download.
cacheEnabled=true
